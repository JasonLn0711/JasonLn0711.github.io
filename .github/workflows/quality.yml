name: Preview and quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: build
          retention-days: 7
