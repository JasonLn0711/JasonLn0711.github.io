name: Preview and quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      - run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: build
          retention-days: 7
